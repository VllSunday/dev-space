name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

# Build jobs run dependency and build scripts, so they only read the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux binary and AppImage
    # Keep the glibc baseline stable instead of inheriting newer runner images.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev libwayland-dev patchelf squashfs-tools

      - run: npm ci
      - run: npm test

      - name: Set package version from release tag
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_VERSION#v}"
          jq -n --arg version "${version}" '{version: $version}' > src-tauri/release-config.json

      - name: Prepare AppImage launcher permissions
        run: node scripts/prepare-appimage.mjs

      - name: Build AppImage and binary
        run: npm exec -- tauri build --ci --bundles appimage --config src-tauri/release-config.json

      - name: Check final AppImage permissions and bundled runtime
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "Expected one AppImage" >&2; exit 1; }
          python3 scripts/check-appimage.py "${images[0]}"

      - name: Stage Linux assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/dev-space "release-assets/Dev-Space-${RELEASE_TAG}-linux-x86_64"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/Dev-Space-${RELEASE_TAG}-x86_64.AppImage"
          mkdir -p portable/dev-space
          cp src-tauri/target/release/dev-space portable/dev-space/
          cp -a .cache/desktop-runtime portable/dev-space/runtime
          cp LICENSE THIRD_PARTY_NOTICES.md portable/dev-space/
          tar -czf "release-assets/Dev-Space-${RELEASE_TAG}-linux-x86_64-portable.tar.gz" -C portable dev-space
          file release-assets/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer and binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npm test

      - name: Set package version from release tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          @{ version = $version } | ConvertTo-Json | Set-Content src-tauri/release-config.json

      - run: npm run build
      - name: Verify full-window desktop layout
        run: node checks/layout-ui.mjs

      - name: Verify pane, font and model interactions
        run: node checks/workbench-ui.mjs && node checks/viewer-ui.mjs

      - name: Build NSIS installer and binary
        run: npm exec -- tauri build --ci --bundles nsis --config src-tauri/release-config.json

      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release-assets/Dev-Space-$env:RELEASE_TAG-windows-x64-setup.exe"
          Copy-Item src-tauri/target/release/dev-space.exe "release-assets/Dev-Space-$env:RELEASE_TAG-windows-x64.exe"
          New-Item -ItemType Directory -Force -Path "portable/Dev Space" | Out-Null
          Copy-Item src-tauri/target/release/dev-space.exe "portable/Dev Space/Dev Space.exe"
          Copy-Item .cache/desktop-runtime "portable/Dev Space/runtime" -Recurse
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md "portable/Dev Space/"
          Compress-Archive -LiteralPath "portable/Dev Space" -DestinationPath "release-assets/Dev-Space-$env:RELEASE_TAG-windows-x64-portable.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npm test

      - name: Set package version from release tag
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          version="${RELEASE_VERSION#v}"
          jq -n --arg version "${version}" '{version: $version}' > src-tauri/release-config.json

      # Asking only for dmg makes Tauri remove the intermediate .app, which
      # the next step also needs for the downloadable app archive.
      - name: Build app and DMG
        run: npm exec -- tauri build --ci --bundles app,dmg --config src-tauri/release-config.json

      - name: Verify the app's code signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/*.app

      - name: Verify packaged Node and native terminals
        run: '"src-tauri/target/release/bundle/macos/Dev Space.app/Contents/Resources/runtime/node" scripts/check-bundled-runtime.mjs'

      - name: Stage macOS assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg "release-assets/Dev-Space-${RELEASE_TAG}-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app "release-assets/Dev-Space-${RELEASE_TAG}-macos-${{ matrix.arch }}.app.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate asset checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          notes_path="release-notes/${RELEASE_TAG#v}.md"
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if [ -f "${notes_path}" ]; then
              gh release create "${RELEASE_TAG}" --title "Dev Space ${RELEASE_TAG}" --notes-file "${notes_path}" --verify-tag
            else
              gh release create "${RELEASE_TAG}" --title "Dev Space ${RELEASE_TAG}" --generate-notes --verify-tag
            fi
          fi

          find release-assets -type f -print0 | xargs -0 gh release upload "${RELEASE_TAG}" --clobber
