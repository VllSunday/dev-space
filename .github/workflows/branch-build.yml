name: Build a Windows preview of the board branch

# A preview build for looking at the branch in a real window. It publishes
# nothing: no tag, no release. The result is a workflow artifact kept 14 days.
on:
  push:
    branches:
      - feat/board-plugins-flows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  windows:
    name: Windows portable folder and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run build

      - name: Build NSIS installer and binary
        run: npm exec -- tauri build --ci --bundles nsis

      - name: Stage the preview
        shell: pwsh
        run: |
          $name = "Dev-Space-preview-$($env:GITHUB_SHA.Substring(0, 7))"
          New-Item -ItemType Directory -Force -Path "preview/$name" | Out-Null
          Copy-Item src-tauri/target/release/dev-space.exe "preview/$name/Dev Space.exe"
          Copy-Item .cache/desktop-runtime "preview/$name/runtime" -Recurse
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md "preview/$name/"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "preview/$name-setup.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-space-windows-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
